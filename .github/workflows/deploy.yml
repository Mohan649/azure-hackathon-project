name: CI/CD Pipeline
on:
  push:
    branches: [ main ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Build and Push Patient Service
        run: az acr build --image patient-service:latest --registry acrhackathonproject --file "Patient service/Dockerfile" "Patient service"

      - name: Build and Push Appointment Service
        run: az acr build --image appointment-service:latest --registry acrhackathonproject --file "Appointment service/Dockerfile" "Appointment service"
